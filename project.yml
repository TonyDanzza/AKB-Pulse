name: AKB
options:
  bundleIdPrefix: ru.tonydanzza
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  AKB:
    type: application
    platform: macOS
    sources:
      - path: Sources/AKB
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: AKB
        PRODUCT_BUNDLE_IDENTIFIER: ru.tonydanzza.akb
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: Sources/AKB/Info.plist
      properties:
        CFBundleName: AKB
        CFBundleDisplayName: "АКБ"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 tonydanzza. Все права защищены."
        CFBundleLocalizations:
          - en
          - ru
    preBuildScripts: []
    postCompileScripts: []
    postBuildScripts:
      - script: |
          "$SRCROOT/scripts/bundle-libimobiledevice.sh" \
              "$BUILT_PRODUCTS_DIR/$WRAPPER_NAME"
        name: Встроить libimobiledevice
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(WRAPPER_NAME)/Contents/Helpers/ideviceinfo
    entitlements:
      path: Sources/AKB/Resources/AKB.entitlements
      properties:
        com.apple.security.app-sandbox: false

  AKBTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AKBTests
      # Тестируемая часть приложения компилируется прямо в бандл тестов:
      # так тестам не нужен host-приложение, которое поднимает строку меню.
      - path: Sources/AKB/Model
      - path: Sources/AKB/Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.tonydanzza.akb.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AKB:
    build:
      targets:
        AKB: all
        AKBTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AKBTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
